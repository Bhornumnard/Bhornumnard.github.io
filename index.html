<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bhornumnard Wanasrisun — Software Engineer (Backend), Python / FastAPI. Resume for HR and recruiters." />
    <meta property="og:title" content="Bhornumnard Wanasrisun — Software Engineer (Backend)" />
    <meta property="og:description" content="Senior backend engineer with 5+ years building Python/FastAPI microservices on production fintech platforms." />
    <meta property="og:url" content="https://bhornumnard.github.io" />
    <meta property="og:type" content="website" />
    <title>Bhornumnard Wanasrisun — Resume</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header" id="site-header">
      <div class="header-left">
        <span class="header-logo" id="header-logo">Bhornumnard Wanasrisun</span>
      </div>
      <div class="header-actions">
        <div class="role-toggle" role="group" aria-label="Resume track">
          <button type="button" class="role-btn active" data-role="backend" aria-pressed="true">Backend</button>
          <button type="button" class="role-btn" data-role="data-engineering" aria-pressed="false">Data Eng</button>
          <!-- AI track: show when resume-ai.json is ready
          <button type="button" class="role-btn" data-role="ai" aria-pressed="false">AI</button>
          -->
        </div>
        <div class="lang-toggle" role="group" aria-label="Language">
          <button type="button" class="lang-btn active" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" class="lang-btn" data-lang="th" aria-pressed="false">TH</button>
        </div>
        <button type="button" class="btn" id="btn-download">Download PDF</button>
        <button type="button" class="btn btn-secondary" id="btn-copy">Copy Link</button>
      </div>
    </header>

    <noscript>
      <p class="noscript-msg">
        This resume requires JavaScript. Contact:
        <a href="mailto:bhornumnard.w@gmail.com">bhornumnard.w@gmail.com</a>
      </p>
    </noscript>

    <main class="resume" id="resume">
      <section class="hero">
        <div class="hero-grid">
          <div class="hero-text">
            <h1 class="hero-name" id="hero-name">Bhornumnard Wanasrisun</h1>
            <p class="hero-title" id="hero-title">Software Engineer (Backend) — Python / FastAPI</p>
            <p class="hero-meta">
              <a class="hero-link" id="hero-phone" href="tel:+66845550485">+66 (0)84-555-0485</a>
              <span class="hero-meta-gap" id="hero-location">Lamphun, Thailand · Open to remote · UTC+7 · ±2–3h from local hours</span>
            </p>
            <div class="hero-qr" id="qr-container" aria-label="QR Code">
              <canvas id="qr-canvas"></canvas>
            </div>
          </div>
          <div class="hero-code" aria-hidden="true">
            <div class="code-window">
              <div class="code-titlebar">
                <div class="code-dots">
                  <span class="code-dot code-dot--red"></span>
                  <span class="code-dot code-dot--yellow"></span>
                  <span class="code-dot code-dot--green"></span>
                </div>
                <span class="code-filename" id="hero-code-filename">engineer.py</span>
              </div>
              <pre class="code-body"><code id="hero-code-body"></code></pre>
            </div>
          </div>
        </div>
      </section>

      <section class="metrics" id="metrics" aria-label="Key metrics"></section>

      <div class="resume-body">
        <aside class="sidebar">
          <section class="card card--quiet">
            <h2 class="section-title" id="label-contacts">Contacts</h2>
            <ul class="contact-list" id="contact-list"></ul>
          </section>

          <section class="card card--quiet">
            <h2 class="section-title" id="label-languages">Languages</h2>
            <ul class="settings-list" id="language-list"></ul>
          </section>

          <section class="card card--standard">
            <div class="card-titlebar">
              <h2 class="card-title" id="label-skills">Skills</h2>
            </div>
            <div class="card-body">
              <div id="skills-container"></div>
            </div>
          </section>
        </aside>

        <div class="main-content">
          <section class="card card--featured">
            <div class="card-titlebar card-titlebar--featured">
              <h2 class="card-title" id="label-employment">Employment History</h2>
            </div>
            <div class="card-body">
              <div id="experience-container"></div>
            </div>
          </section>

          <section class="card card--standard">
            <div class="card-titlebar">
              <h2 class="card-title" id="label-profile">Profile</h2>
            </div>
            <div class="card-body">
              <p class="profile-text" id="profile-text"></p>
            </div>
          </section>

          <section class="card card--quiet">
            <h2 class="section-title" id="label-education">Education</h2>
            <div id="education-container"></div>
          </section>
        </div>
      </div>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
